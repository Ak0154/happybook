[tool.poetry]
name = "happybook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"

bcrypt = "4.0.1"
bson = ">=0.5.10"
fastapi = ">=0.135.2"
groq = ">=1.1.2"
jwt = ">=1.4.0"
motor = ">=3.7.1"
openai = ">=2.30.0"
passlib = { extras = ["bcrypt"], version = ">=1.7.4" }
pydantic = { extras = ["email"], version = ">=2.12.5" }
python-dotenv = ">=1.2.2"
python-jose = { extras = ["cryptography"], version = ">=3.5.0" }
uvicorn = ">=0.42.0"