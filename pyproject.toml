[tool.poetry]
name = "happybook"
version = "0.1.0"
description = "Student assistant backend"
authors = ["your name"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "*"
uvicorn = "*"
motor = "*"
pymongo = "*"
certifi = "*"
passlib = {extras = ["bcrypt"], version = "*"}
python-jose = {extras = ["cryptography"], version = "*"}
python-dotenv = "*"
groq = "*"
pydantic = {extras = ["email"], version = "*"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"